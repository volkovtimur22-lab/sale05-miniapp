<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sale05</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--tg-theme-bg-color, #fff);
        color: var(--tg-theme-text-color, #000);
        padding: 12px;
        margin: 0;
      }
      input, select {
        width: 100%;
        padding: 10px;
        margin-bottom: 12px;
        border-radius: 8px;
        border: 1px solid var(--tg-theme-button-color, #ccc);
        box-sizing: border-box;
      }
      .card {
        background: var(--tg-theme-secondary-bg-color, #f5f5f5);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 12px;
      }
      .store { font-weight: 600; }
      .price-row { display: flex; justify-content: space-between; align-items: baseline; }
      .old-price { text-decoration: line-through; color: #999; }
      .new-price { font-weight: bold; font-size: 1.1em; }
      .discount { color: var(--tg-theme-button-color, #3390ec); font-weight: bold; }
      .date { margin-top: 8px; font-size: 0.85em; color: var(--tg-theme-hint-color, #888); }
    </style>
  </head>
  <body>
    <h2>Sale05 — скидки и акции</h2>
    <input id="search" placeholder="Поиск по товару/магазину" />
    <select id="category">
      <option value="">Все категории</option>
      <option value="продукты">Продукты</option>
      <option value="техника">Техника</option>
      <option value="одежда">Одежда</option>
    </select>
    <div id="list"></div>

    <script>
      const tg = window.Telegram.WebApp;
      tg.ready();

      const promos = [
        {
          store: 'СуперМаркет',
          product: 'Молоко 3,2%',
          category: 'продукты',
          oldPrice: 99,
          newPrice: 79,
          discount: '20%',
          date: 'до 31.10.2026'
        },
        {
          store: 'Бытовая техника',
          product: 'Пылесос X10',
          category: 'техника',
          oldPrice: 14990,
          newPrice: 11990,
          discount: '20%',
          date: 'до 15.11.2026'
        },
        {
          store: 'Одежда',
          product: 'Футболка базовая',
          category: 'одежда',
          oldPrice: 1990,
          newPrice: 1390,
          discount: '30%',
          date: 'до 20.11.2026'
        }
      ];

      function render() {
        const q = document.getElementById('search').value.toLowerCase();
        const cat = document.getElementById('category').value;
        const container = document.getElementById('list');
        container.innerHTML = '';

        promos.filter(p =>
          (!q || p.product.toLowerCase().includes(q) || p.store.toLowerCase().includes(q)) &&
          (!cat || p.category === cat)
        ).forEach(p => {
          const div = document.createElement('div');
          div.className = 'card';
          div.innerHTML = `
            <div class="store">${p.store}</div>
            <div>${p.product} <span style="color:#888; font-size:0.8em">(${p.category})</span></div>
            <div class="price-row">
              <span class="old-price">${p.oldPrice} ₽</span>
              <span><span class="new-price">${p.newPrice} ₽</span> <span class="discount">${p.discount}</span></span>
            </div>
            <div class="date">Действует: ${p.date}</div>
          `;
          container.appendChild(div);
        });

        if (container.children.length === 0) {
          container.innerHTML = '<div style="padding:16px; color:#888;">Ничего не найдено</div>';
        }
      }

      [document.getElementById('search'), document.getElementById('category')].forEach(el => el.addEventListener('input', render));
      render();
    </script>
  <!-- твой существующий контент -->
<p>Какой-то текст на странице...</p>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
</script>
</body>
</html>
</body>
</html>
