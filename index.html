<!DOCTYPE html>
<html style="--tg-viewport-height: 100vh; --tg-viewport-stable-height: 100vh;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sale05 — скидки и акции</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); margin: 0; padding: 12px; box-sizing: border-box; }
      h2 { margin-top: 0; }
      input, select { width: 100%; padding: 10px; margin-bottom: 12px; border-radius: 8px; border: 1px solid var(--tg-theme-secondary-bg-color, #ddd); background-color: var(--tg-theme-secondary-bg-color, #f5f5f5); color: var(--tg-theme-text-color, #000); }
      .card { background-color: var(--tg-theme-secondary-bg-color, #f9f9f9); border-radius: 12px; padding: 12px; margin-bottom: 12px; border: 1px solid var(--tg-theme-secondary-bg-color, #eee); }
      .card strong { color: var(--tg-theme-text-color, #000); }
      .price-old { text-decoration: line-through; color: #999; }
      .price-new { font-weight: bold; color: var(--tg-theme-button-color, #2481cc); }
      .discount { color: var(--tg-theme-button-text-color, #fff); background: var(--tg-theme-button-color, #2481cc); padding: 2px 6px; border-radius: 4px; font-size: 0.85em; }
      .date { font-size: 0.85em; color: #666; margin-top: 4px; display: block; }
      .no-results { text-align: center; padding: 20px; color: #666; }
    </style>
  </head>
  <body>
    <h2>Sale05 — скидки и акции</h2>
    <input id="search" type="text" placeholder="Поиск по товару/магазину" />
    <select id="category">
      <option value="">Все категории</option>
      <option value="продукты">Продукты</option>
      <option value="техника">Техника</option>
      <option value="одежда">Одежда</option>
    </select>
    <div id="list"></div>

    <script>
      // Инициализация
      const tg = window.Telegram.WebApp;
      tg.ready();

      // Данные
      const promos = [
        { store: 'СуперМаркет', product: 'Молоко 3,2%', category: 'продукты', oldPrice: 99, newPrice: 79, discount: '20%', date: 'до 31.10.2026' },
        { store: 'Бытовая техника', product: 'Пылесос X10', category: 'техника', oldPrice: 14990, newPrice: 11990, discount: '20%', date: 'до 15.11.2026' },
        { store: 'Одежда', product: 'Футболка базовая', category: 'одежда', oldPrice: 1990, newPrice: 1390, discount: '30%', date: 'до 20.11.2026' }
      ];

      // Логика
      function render() {
        const q = (document.getElementById('search').value || '').toLowerCase();
        const cat = document.getElementById('category').value;
        const container = document.getElementById('list');
        
        if (!container) return; // Защита от ошибки, если div не найден
        container.innerHTML = '';

        const filtered = promos.filter(p => {
          const matchesSearch = !q || p.product.toLowerCase().includes(q) || p.store.toLowerCase().includes(q);
          const matchesCategory = !cat || p.category === cat;
          return matchesSearch && matchesCategory;
        });

        if (filtered.length === 0) {
          container.innerHTML = '<div class="no-results">Ничего не найдено</div>';
          return;
        }

        filtered.forEach(p => {
          const div = document.createElement('div');
          div.className = 'card';
          // Обратные кавычки и чистые \${}
          div.innerHTML = `
            <strong>\${p.store}</strong><br>
            <span>${p.product} (${p.category})</span><br><br>
            <span class="price-old">\${p.oldPrice} ₽</span> → 
            <span class="price-new">\${p.newPrice} ₽</span>
            <span class="discount">\${p.discount}</span><br>
            <span class="date">Действует: \${p.date}</span>
          `;
          container.appendChild(div);
        });
      }

      // Слушатели событий
      [document.getElementById('search'), document.getElementById('category')]
        .forEach(el => el.addEventListener('input', render));

      // Запуск при загрузке
      render();
    </script>
  </body>
</html>
