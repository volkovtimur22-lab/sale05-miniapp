<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Shawarma Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-1: #fff5ea;
      --bg-2: #ffe7c7;
      --primary: #1d130f;
      --text: #201712;
      --muted: #675551;
      --accent: #ff8a2d;
      --accent-strong: #ef6b1d;
      --success: #1fa76d;
      --card: rgba(255,255,255,0.84);
      --line: rgba(32,23,18,0.08);
      --shadow: 0 18px 34px rgba(41, 23, 14, 0.12);
      --radius: 24px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 35%, #fffdfb 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      background: rgba(255,253,250,0.75);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 900;
      letter-spacing: 0.08em;
      font-size: 1.08rem;
      color: var(--primary);
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: linear-gradient(135deg, #ffca80 0%, #ff8d2f 50%, #9a4d1f 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: 0 14px 18px rgba(255, 143, 44, 0.25);
    }

    .cart-pill {
      min-width: 30px;
      height: 30px;
      border-radius: 999px;
      background: rgba(255, 143, 44, 0.12);
      border: 1px solid rgba(255, 143, 44, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      color: var(--primary);
      font-weight: 800;
      font-size: 0.76rem;
    }

    .content {
      padding: 16px 16px 92px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      border-radius: 30px;
      padding: 18px 16px 16px;
      margin-bottom: 18px;
      background: linear-gradient(135deg, rgba(20,12,9,0.7), rgba(71,32,18,0.82));
      color: white;
      box-shadow: 0 18px 30px rgba(61, 34, 21, 0.24);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .hero-tag {
      display: inline-block;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.16);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #ffe4c4;
    }

    .hero h2 {
      margin: 12px 0 8px;
      font-size: 1.6rem;
      line-height: 1.2;
    }

    .hero p {
      margin: 0;
      color: rgba(255, 234, 213, 0.88);
      line-height: 1.5;
      font-size: 0.92rem;
    }

    .hero-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .mini-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      color: #ffe7cf;
      font-size: 0.72rem;
      font-weight: 800;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 18px 0 12px;
    }

    .section-title h3 {
      margin: 0;
      font-size: 1.18rem;
    }

    .badge-small {
      font-size: 0.72rem;
      font-weight: 800;
      color: #904c18;
      background: rgba(255,143,44,0.12);
      border-radius: 999px;
      padding: 6px 10px;
    }

    .product-grid {
      display: grid;
      gap: 12px;
    }

    .product-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 12px;
      display: grid;
      grid-template-columns: 94px 1fr;
      gap: 12px;
    }

    .product-image-wrap {
      position: relative;
      width: 94px;
      height: 94px;
      border-radius: 18px;
      overflow: hidden;
      background: linear-gradient(135deg, #fff3e4, #fbe3d0);
      border: 1px solid rgba(35,25,19,0.04);
    }

    .product-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .product-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .product-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .store-name {
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .rating {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(255, 143, 44, 0.12);
      color: #b55a20;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 0.7rem;
      font-weight: 800;
    }

    .product-name {
      margin-top: 6px;
      color: var(--text);
      font-weight: 900;
      font-size: 1rem;
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .desc {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .meta-row {
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .price-box {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .old-price {
      color: var(--muted);
      font-size: 0.72rem;
      text-decoration: line-through;
    }

    .new-price {
      color: var(--success);
      font-size: 1.06rem;
      font-weight: 900;
    }

    .discount-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 0.72rem;
      font-weight: 800;
      background: rgba(255,143,44,0.12);
      color: #b55a20;
    }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 10px 12px 18px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(8px);
      border-top: 1px solid rgba(35,25,19,0.08);
      z-index: 40;
    }

    .nav-item {
      width: 33.333%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 800;
      user-select: none;
    }

    .nav-item.active { color: var(--primary); }
    .nav-emoji { font-size: 1.4rem; line-height: 1; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand-wrap">
      <div class="brand-mark">S</div>
      <div>SHAWARMA</div>
    </div>
    <div class="cart-pill">0</div>
  </header>

  <main class="content">
    <section class="hero">
      <div class="hero-tag">HOT DEAL</div>
      <h2>Шаурма по-русски</h2>
      <p>Сочные начинки, свежие овощи и фирменные соусы — всё, что нужно для вкусного перекуса.</p>
      <div class="hero-row">
        <div class="mini-pill">🔥 Горячая подача</div>
        <div class="mini-pill">🥬 Свежие овощи</div>
        <div class="mini-pill">⚡ За 15 минут</div>
      </div>
    </section>

    <div class="section-title">
      <h3>Популярное</h3>
      <span class="badge-small">3 товара</span>
    </div>

    <div class="product-grid" id="productGrid"></div>
  </main>

  <nav class="bottom-nav" aria-label="Навигация">
    <div class="nav-item active">
      <div class="nav-emoji">🏠</div>
      <div>Главная</div>
    </div>
    <div class="nav-item">
      <div class="nav-emoji">🛒</div>
      <div>Корзина</div>
    </div>
  </nav>

  <script>
    const items = [
      {
        id: 'lavash',
        name: 'Шаурма в лаваше',
        store: 'Классика',
        rating: 4.9,
        price: 240,
        oldPrice: 280,
        discount: '15%',
        description: 'Мягкий лаваш, сочное мясо и свежие овощи с фирменным соусом.',
        image: 'lavash.jpg'
      },
      {
        id: 'bun',
        name: 'Шаурма в булке',
        store: 'Теплый брикет',
        rating: 4.8,
        price: 260,
        oldPrice: 310,
        discount: 'Комбо',
        description: 'Ароматная булка, плотная начинка и пикантный вкус с сырной ноткой.',
        image: 'bun.jpg'
      },
      {
        id: 'pita',
        name: 'Шаурма в пите',
        store: 'Оригинал',
        rating: 5.0,
        price: 280,
        oldPrice: 330,
        discount: 'Лучший выбор',
        description: 'Пита с очень сочным наполнением, яркими овощами и насыщенным вкусом.',
        image: 'pita.jpg'
      }
    ];

    const productGrid = document.getElementById('productGrid');

    function formatPrice(value) {
      return `${value} ₽`;
    }

    productGrid.innerHTML = items.map(item => `
      <article class="product-card" data-id="${item.id}">
        <div class="product-image-wrap">
          <img class="product-image" src="${item.image}" alt="${item.name}" />
        </div>
        <div class="product-info">
          <div class="product-top">
            <span class="store-name">${item.store}</span>
            <span class="rating">★ ${item.rating}</span>
          </div>
          <div class="product-name">${item.name}</div>
          <div class="desc">${item.description}</div>
          <div class="meta-row">
            <div class="price-box">
              <span class="old-price">${formatPrice(item.oldPrice)}</span>
              <span class="new-price">${formatPrice(item.price)}</span>
            </div>
            <span class="discount-badge">${item.discount}</span>
          </div>
        </div>
      </article>
    `).join('');
  </script>
</body>
</html>
