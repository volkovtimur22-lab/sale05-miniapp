<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Sale05 — Магазин</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #f5f7ff;
            --panel: #ffffff;
            --panel-alt: #f3f6ff;
            --primary: #5b5ce6;
            --primary-2: #8a63ff;
            --primary-soft: rgba(91, 92, 230, 0.12);
            --accent: #ff8f6b;
            --accent-2: #ff5f7a;
            --success: #20b36b;
            --text: #1f2430;
            --muted: #757d90;
            --line: #e9edf8;
            --shadow: 0 10px 26px rgba(35, 37, 94, 0.08);
            --radius: 18px;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            min-height: 100%;
            background: var(--tg-theme-bg-color, var(--bg));
            color: var(--tg-theme-text-color, var(--text));
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background: linear-gradient(135deg, rgba(91, 92, 230, 0.96), rgba(138, 99, 255, 0.96));
            color: white;
            box-shadow: 0 8px 24px rgba(91, 92, 230, 0.22);
        }

        .brand {
            font-weight: 900;
            font-size: 1.25rem;
            letter-spacing: 0.02em;
        }

        .cart-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 32px;
            height: 32px;
            padding: 0 10px;
            border-radius: 999px;
            background: rgba(255,255,255,0.18);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            font-weight: 800;
            font-size: 0.82rem;
        }

        .content {
            flex: 1;
            padding: 14px 16px 94px;
            overflow-y: auto;
        }

        .content::-webkit-scrollbar { width: 0; height: 0; }

        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 16px;
            scrollbar-width: none;
        }

        .categories::-webkit-scrollbar { display: none; }

        .category {
            border: 1px solid var(--line);
            background: var(--panel);
            color: var(--muted);
            border-radius: 999px;
            padding: 8px 12px;
            font-size: 0.82rem;
            font-weight: 800;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .category.active {
            background: linear-gradient(135deg, var(--primary-soft), rgba(138,99,255,0.12));
            border-color: rgba(91, 92, 230, 0.15);
            color: var(--primary);
        }

        .search-wrap {
            margin-bottom: 16px;
        }

        .search-input {
            width: 100%;
            border-radius: 14px;
            border: 1px solid var(--line);
            background: var(--panel);
            color: var(--tg-theme-text-color, var(--text));
            padding: 12px 14px;
            font-size: 0.95rem;
            outline: none;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
        }

        .search-input:focus {
            border-color: rgba(91, 92, 230, 0.45);
            box-shadow: 0 0 0 4px rgba(91, 92, 230, 0.08);
        }

        .product-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .product-card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 12px;
            display: grid;
            grid-template-columns: 92px 1fr;
            gap: 12px;
        }

        .product-image-wrapper {
            position: relative;
            width: 92px;
            height: 92px;
            border-radius: 16px;
            overflow: hidden;
            background: linear-gradient(135deg, #eef2ff, #f1fdf8);
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .product-info {
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .store-name {
            color: var(--muted);
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .product-name {
            font-size: 1rem;
            font-weight: 800;
            line-height: 1.3;
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .meta-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 10px;
        }

        .price-box {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .old-price {
            color: var(--muted);
            font-size: 0.74rem;
            text-decoration: line-through;
        }

        .new-price {
            font-weight: 900;
            font-size: 1.08rem;
            color: var(--success);
        }

        .discount-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: white;
            border-radius: 8px;
            font-size: 0.72rem;
            font-weight: 800;
            padding: 6px 8px;
        }

        .add-btn {
            margin-top: 12px;
            width: 100%;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            color: white;
            font-weight: 800;
            padding: 10px 12px;
            cursor: pointer;
            box-shadow: 0 12px 20px rgba(91, 92, 230, 0.2);
        }

        .bottom-nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(8px);
            border-top: 1px solid var(--line);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 12px 18px;
            z-index: 40;
        }

        .nav-item {
            width: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: var(--muted);
            font-size: 0.7rem;
            font-weight: 800;
            cursor: pointer;
            user-select: none;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-emoji {
            font-size: 1.4rem;
            line-height: 1;
        }

        .page { display: none; }
        .page.active { display: block; }

        .empty-state {
            text-align: center;
            color: var(--muted);
            padding: 32px 16px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
        }

        .cart-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 6px 0 16px;
        }

        .cart-header h3 {
            margin: 0;
            font-size: 1.2rem;
        }

        .cart-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .cart-item {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .cart-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1;
        }

        .cart-thumb {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: linear-gradient(135deg, #eef2ff, #ebfaf3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            font-size: 0.7rem;
            font-weight: 800;
            flex-shrink: 0;
        }

        .cart-name {
            font-weight: 800;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .cart-price {
            font-size: 0.82rem;
            color: var(--muted);
        }

        .remove-btn {
            border: none;
            background: #fff1f1;
            color: #ef5d5d;
            width: 32px;
            height: 32px;
            border-radius: 10px;
            font-size: 1.1rem;
            cursor: pointer;
            font-weight: 900;
        }

        .cart-total {
            margin-top: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 900;
            font-size: 1.08rem;
            padding-top: 12px;
            border-top: 1px solid var(--line);
        }

        .checkout-btn {
            margin-top: 16px;
            width: 100%;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #20b36b, #17a25d);
            color: white;
            font-weight: 900;
            padding: 12px 16px;
            cursor: pointer;
            box-shadow: 0 12px 20px rgba(32, 179, 107, 0.22);
        }

        @media (min-width: 500px) {
            .content {
                max-width: 560px;
                margin: 0 auto;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="brand">Sale05</div>
        <div id="cart-badge" class="cart-pill">0</div>
    </header>

    <main class="content">
        <section id="page-catalog" class="page active">
            <div class="categories" id="categories"></div>

            <div class="search-wrap">
                <input id="search" class="search-input" type="text" placeholder="Поиск товаров...">
            </div>

            <div id="product-list" class="product-list"></div>
        </section>

        <section id="page-cart" class="page">
            <div class="cart-header">
                <h3>🛒 Корзина</h3>
            </div>

            <div id="cart-list" class="cart-list"></div>
            <div id="cart-total" class="cart-total"></div>
            <button id="checkout-btn" class="checkout-btn">Оформить заказ</button>
        </section>
    </main>

    <nav class="bottom-nav">
        <div class="nav-item active" data-page="catalog">
            <span class="nav-emoji">🏠</span>
            <span>Каталог</span>
        </div>
        <div class="nav-item" data-page="cart">
            <span class="nav-emoji">🛒</span>
            <span>Корзина</span>
        </div>
    </nav>

    <script>
        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg) tg.ready();

        const app = {
            cart: [],
            activeCategory: 'all',
            products: [
                { id: 1, category: 'food', store: 'СуперМаркет', product: 'Молоко 3,2%', price: 79, discount: 20, image: 'https://images.unsplash.com/photo-1550583724-b2692b85b150?auto=format&fit=crop&w=800&q=80' },
                { id: 2, category: 'food', store: 'СуперМаркет', product: 'Кефир 1%', price: 85, discount: 15, image: 'https://images.unsplash.com/photo-1570584191640-7dfe2ffeb65a?auto=format&fit=crop&w=800&q=80' },
                { id: 3, category: 'food', store: 'FreshBox', product: 'Яблоки Gala', price: 189, discount: 12, image: 'https://images.unsplash.com/photo-1567306226416-28f0efdc88ce?auto=format&fit=crop&w=800&q=80' },
                { id: 4, category: 'food', store: 'FreshBox', product: 'Авокадо', price: 160, discount: 10, image: 'https://images.unsplash.com/photo-1519162808019-7de1683fa2ad?auto=format&fit=crop&w=800&q=80' },
                { id: 5, category: 'tech', store: 'ТехноДом', product: 'Пылесос X10', price: 11990, discount: 20, image: 'https://images.unsplash.com/photo-1581578731548-c64695cc6952?auto=format&fit=crop&w=800&q=80' },
                { id: 6, category: 'tech', store: 'ТехноДом', product: 'Утюг Pro', price: 4500, discount: 10, image: 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=800&q=80' },
                { id: 7, category: 'tech', store: 'GadgetHub', product: 'Наушники Air Lite', price: 5990, discount: 25, image: 'https://images.unsplash.com/photo-1546435770-a3e426bf472b?auto=format&fit=crop&w=800&q=80' },
                { id: 8, category: 'tech', store: 'GadgetHub', product: 'Умная колонка', price: 8890, discount: 18, image: 'https://images.unsplash.com/photo-1518444065439-e933c06ce9cd?auto=format&fit=crop&w=800&q=80' },
                { id: 9, category: 'fashion', store: 'FashionStyle', product: 'Футболка базовая', price: 1390, discount: 30, image: 'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=800&q=80' },
                { id: 10, category: 'fashion', store: 'FashionStyle', product: 'Худи черное', price: 2990, discount: 25, image: 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=800&q=80' },
                { id: 11, category: 'fashion', store: 'UrbanLook', product: 'Кроссовки Urban', price: 4290, discount: 22, image: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=800&q=80' },
                { id: 12, category: 'fashion', store: 'UrbanLook', product: 'Сумка Everyday', price: 2490, discount: 15, image: 'https://images.unsplash.com/photo-1584917865442-de89df76afd3?auto=format&fit=crop&w=800&q=80' },
                { id: 13, category: 'home', store: 'HomeJoy', product: 'Текстильный набор', price: 1590, discount: 18, image: 'https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=800&q=80' },
                { id: 14, category: 'home', store: 'HomeJoy', product: 'Одеяло Cozy', price: 3290, discount: 20, image: 'https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=800&q=80' },
                { id: 15, category: 'beauty', store: 'GlowLab', product: 'Крем для лица', price: 890, discount: 14, image: 'https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?auto=format&fit=crop&w=800&q=80' },
                { id: 16, category: 'beauty', store: 'GlowLab', product: 'Сыворотка Vit C', price: 1290, discount: 16, image: 'https://images.unsplash.com/photo-1571781926291-c477ebfd024b?auto=format&fit=crop&w=800&q=80' }
            ],
            categoryMeta: {
                all: 'Все',
                food: 'Еда',
                tech: 'Техника',
                fashion: 'Одежда',
                home: 'Дом',
                beauty: 'Красота'
            },

            init() {
                this.renderCategories();
                this.renderCatalog();

                document.getElementById('search').addEventListener('input', (event) => {
                    this.renderCatalog(event.target.value.trim());
                });

                document.querySelectorAll('.nav-item').forEach((item) => {
                    item.addEventListener('click', () => this.switchPage(item.dataset.page));
                });

                document.getElementById('checkout-btn').addEventListener('click', () => this.checkout());
            },

            renderCategories() {
                const categoriesEl = document.getElementById('categories');
                categoriesEl.innerHTML = '';

                Object.entries(this.categoryMeta).forEach(([key, label]) => {
                    const btn = document.createElement('button');
                    btn.className = 'category' + (this.activeCategory === key ? ' active' : '');
                    btn.type = 'button';
                    btn.textContent = label;
                    btn.addEventListener('click', () => {
                        this.activeCategory = key;
                        this.renderCategories();
                        this.renderCatalog();
                    });
                    categoriesEl.appendChild(btn);
                });
            },

            getFilteredProducts(query = '') {
                const normalized = query.toLowerCase();
                return this.products.filter((item) => {
                    const matchesCategory = this.activeCategory === 'all' || item.category === this.activeCategory;
                    const matchesQuery = !normalized || item.product.toLowerCase().includes(normalized) || item.store.toLowerCase().includes(normalized);
                    return matchesCategory && matchesQuery;
                });
            },

            renderCatalog(query = '') {
                const list = document.getElementById('product-list');
                const items = this.getFilteredProducts(query);
                list.innerHTML = '';

                if (!items.length) {
                    list.innerHTML = '<div class="empty-state">Товары не найдены</div>';
                    return;
                }

                items.forEach((item) => {
                    const card = document.createElement('div');
                    card.className = 'product-card';

                    const imageWrap = document.createElement('div');
                    imageWrap.className = 'product-image-wrapper';

                    const image = document.createElement('img');
                    image.className = 'product-image';
                    image.src = item.image;
                    image.alt = item.product;
                    image.loading = 'lazy';
                    imageWrap.appendChild(image);

                    const info = document.createElement('div');
                    info.className = 'product-info';

                    const store = document.createElement('div');
                    store.className = 'store-name';
                    store.textContent = item.store;

                    const name = document.createElement('div');
                    name.className = 'product-name';
                    name.textContent = item.product;

                    const metaRow = document.createElement('div');
                    metaRow.className = 'meta-row';

                    const prices = document.createElement('div');
                    prices.className = 'price-box';

                    if (item.discount) {
                        const oldPrice = document.createElement('div');
                        oldPrice.className = 'old-price';
                        oldPrice.textContent = Math.round(item.price / (1 - item.discount / 100)) + ' ₽';

                        const price = document.createElement('div');
                        price.className = 'new-price';
                        price.textContent = item.price + ' ₽';

                        prices.appendChild(oldPrice);
                        prices.appendChild(price);
                    } else {
                        const price = document.createElement('div');
                        price.className = 'new-price';
                        price.textContent = item.price + ' ₽';
                        prices.appendChild(price);
                    }

                    const badge = document.createElement('div');
                    badge.className = 'discount-badge';
                    badge.textContent = item.discount ? '-' + item.discount + '%' : 'Новинка';

                    metaRow.appendChild(prices);
                    metaRow.appendChild(badge);

                    const button = document.createElement('button');
                    button.className = 'add-btn';
                    button.type = 'button';
                    button.textContent = 'В корзину';
                    button.addEventListener('click', () => this.addToCart(item));

                    info.appendChild(store);
                    info.appendChild(name);
                    info.appendChild(metaRow);
                    info.appendChild(button);

                    card.appendChild(imageWrap);
                    card.appendChild(info);
                    list.appendChild(card);
                });
            },

            switchPage(pageName) {
                document.querySelectorAll('.page').forEach((el) => {
                    el.classList.toggle('active', el.id === 'page-' + pageName);
                });

                document.querySelectorAll('.nav-item').forEach((el) => {
                    el.classList.toggle('active', el.dataset.page === pageName);
                });

                if (pageName === 'cart') {
                    this.renderCart();
                }
            },

            addToCart(item) {
                this.cart.push({
                    id: item.id,
                    name: item.product,
                    price: item.price,
                    category: item.category
                });
                this.updateCartBadge();
                this.renderCart();
            },

            updateCartBadge() {
                document.getElementById('cart-badge').textContent = String(this.cart.length);
            },

            renderCart() {
                const list = document.getElementById('cart-list');
                const totalEl = document.getElementById('cart-total');
                list.innerHTML = '';

                if (!this.cart.length) {
                    list.innerHTML = '<div class="empty-state">Корзина пуста</div>';
                    totalEl.textContent = '';
                    return;
                }

                let total = 0;
                this.cart.forEach((item, index) => {
                    total += item.price;

                    const row = document.createElement('div');
                    row.className = 'cart-item';

                    const left = document.createElement('div');
                    left.className = 'cart-left';

                    const thumb = document.createElement('div');
                    thumb.className = 'cart-thumb';
                    thumb.textContent = item.name.slice(0, 2).toUpperCase();

                    const text = document.createElement('div');
                    const name = document.createElement('div');
                    name.className = 'cart-name';
                    name.textContent = item.name;

                    const price = document.createElement('div');
                    price.className = 'cart-price';
                    price.textContent = item.price + ' ₽';

                    text.appendChild(name);
                    text.appendChild(price);
                    left.appendChild(thumb);
                    left.appendChild(text);

                    const remove = document.createElement('button');
                    remove.className = 'remove-btn';
                    remove.type = 'button';
                    remove.textContent = '×';
                    remove.addEventListener('click', () => this.removeFromCart(index));

                    row.appendChild(left);
                    row.appendChild(remove);
                    list.appendChild(row);
                });

                totalEl.innerHTML = '<span>Итого</span><span>' + total + ' ₽</span>';
            },

            removeFromCart(index) {
                this.cart.splice(index, 1);
                this.updateCartBadge();
                this.renderCart();
            },

            checkout() {
                const total = this.cart.reduce((sum, item) => sum + item.price, 0);
                if (!this.cart.length) return;

                const payload = {
                    items: this.cart,
                    total: total,
                    createdAt: new Date().toISOString()
                };

                if (tg) {
                    tg.sendData(JSON.stringify(payload));
                } else {
                    alert('Заказ сформирован на сумму: ' + total + ' ₽');
                }
            }
        };

        app.init();
    </script>
</body>
</html>
