<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Sale05 — Premium Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #f5f6ff;
      --panel: #ffffff;
      --panel-soft: #f3f5ff;
      --primary: #4d5ef6;
      --primary-2: #7b54ff;
      --primary-soft: rgba(77,94,246,0.12);
      --success: #1ebc7a;
      --success-soft: rgba(30,188,122,0.12);
      --accent: #ff8a5a;
      --accent-2: #ff5a88;
      --text: #1b2132;
      --muted: #6f7890;
      --line: #e7ebf7;
      --shadow: 0 12px 28px rgba(37, 45, 92, 0.08);
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--tg-theme-bg-color, var(--bg));
      color: var(--tg-theme-text-color, var(--text));
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    button, input, select {
      font: inherit;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: white;
      box-shadow: 0 10px 26px rgba(77,94,246,0.22);
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: rgba(255,255,255,0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      backdrop-filter: blur(6px);
    }

    .brand {
      font-size: 1.2rem;
      font-weight: 900;
      letter-spacing: 0.02em;
    }

    .cart-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 32px;
      height: 32px;
      padding: 0 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.35);
      font-weight: 800;
      font-size: 0.8rem;
    }

    .content {
      flex: 1;
      padding: 14px 16px 96px;
      overflow-y: auto;
    }

    .content::-webkit-scrollbar { width: 0; height: 0; }

    .promo {
      background: linear-gradient(135deg, #1d2148, #2a2d6d 40%, #4d5ef6);
      color: white;
      border-radius: 22px;
      padding: 18px 16px;
      box-shadow: 0 18px 30px rgba(45, 55, 120, 0.16);
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
    }

    .promo::after {
      content: '';
      position: absolute;
      width: 150px;
      height: 150px;
      background: rgba(255,255,255,0.08);
      border-radius: 50%;
      right: -20px;
      top: -30px;
    }

    .promo-tag {
      display: inline-block;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 999px;
      padding: 6px 10px;
      font-weight: 700;
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .promo h2 {
      margin: 12px 0 8px;
      font-size: 1.56rem;
      line-height: 1.2;
    }

    .promo p {
      margin: 0;
      opacity: 0.9;
      font-size: 0.92rem;
    }

    .promo-row {
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .mini-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 0.76rem;
      font-weight: 700;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 14px;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar { display: none; }

    .category {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      border-radius: 999px;
      padding: 9px 12px;
      font-size: 0.8rem;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .category.active {
      background: linear-gradient(135deg, var(--primary-soft), rgba(123,84,255,0.12));
      border-color: rgba(77,94,246,0.16);
      color: var(--primary);
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .search-wrap {
      flex: 1;
    }

    .search-input {
      width: 100%;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--tg-theme-text-color, var(--text));
      padding: 12px 14px;
      font-size: 0.95rem;
      outline: none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
    }

    .search-input:focus {
      border-color: rgba(77,94,246,0.45);
      box-shadow: 0 0 0 4px rgba(77,94,246,0.08);
    }

    .sort-select {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      color: var(--text);
      padding: 11px 12px;
      font-weight: 700;
      outline: none;
    }

    .product-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .product-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 12px;
      display: grid;
      grid-template-columns: 94px 1fr;
      gap: 12px;
    }

    .product-image-wrapper {
      position: relative;
      width: 94px;
      height: 94px;
      border-radius: 18px;
      overflow: hidden;
      background: linear-gradient(135deg, #eef2ff, #eefdf6);
    }

    .product-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .favorite-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(255,255,255,0.86);
      border: none;
      color: #ff5d80;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 14px rgba(0,0,0,0.08);
    }

    .product-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .product-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .store-name {
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .rating {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #fff8ea;
      color: #d77d00;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 0.7rem;
      font-weight: 800;
    }

    .product-name {
      font-size: 1rem;
      font-weight: 800;
      line-height: 1.35;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .desc {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 5px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 10px;
    }

    .price-box {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .old-price {
      color: var(--muted);
      font-size: 0.73rem;
      text-decoration: line-through;
    }

    .new-price {
      font-weight: 900;
      font-size: 1.08rem;
      color: var(--success);
    }

    .discount-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 6px 8px;
    }

    .btn-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
    }

    .ghost-btn, .add-btn {
      border: none;
      border-radius: 12px;
      padding: 10px 12px;
      cursor: pointer;
      font-weight: 800;
      transition: transform 0.15s ease;
    }

    .ghost-btn:active, .add-btn:active, .checkout-btn:active, .quantity-btn:active, .modal-action:active {
      transform: translateY(1px) scale(0.99);
    }

    .ghost-btn {
      background: var(--panel-soft);
      color: var(--primary);
      flex: 0 0 auto;
      min-width: 42px;
    }

    .add-btn {
      flex: 1;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: white;
      box-shadow: 0 12px 20px rgba(77,94,246,0.2);
    }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 12px 18px;
      z-index: 40;
    }

    .nav-item {
      width: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 800;
      cursor: pointer;
      user-select: none;
    }

    .nav-item.active {
      color: var(--primary);
    }

    .nav-emoji { font-size: 1.4rem; line-height: 1; }

    .page { display: none; }
    .page.active { display: block; }

    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 32px 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .cart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 6px 0 16px;
    }

    .cart-header h3 {
      margin: 0;
      font-size: 1.2rem;
    }

    .cart-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .cart-item {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .cart-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .cart-thumb {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #eef2ff, #ebfaf3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 800;
      flex-shrink: 0;
      overflow: hidden;
    }

    .cart-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cart-name {
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cart-price {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .remove-btn {
      border: none;
      background: #fff1f1;
      color: #ef5d5d;
      width: 32px;
      height: 32px;
      border-radius: 10px;
      font-size: 1.1rem;
      cursor: pointer;
      font-weight: 900;
    }

    .promo-box {
      background: linear-gradient(135deg, #fff4eb, #f5f7ff);
      border: 1px solid #f0d9c7;
      border-radius: 16px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 18px;
      color: var(--text);
    }

    .promo-box strong { color: var(--primary); }

    .promo-input {
      width: 100%;
      border-radius: 10px;
      border: 1px solid var(--line);
      padding: 10px 12px;
      background: white;
      margin-top: 12px;
      outline: none;
    }

    .cart-total {
      margin-top: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 900;
      font-size: 1.08rem;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .checkout-btn {
      margin-top: 16px;
      width: 100%;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #23b86a, #1ca560);
      color: white;
      font-weight: 900;
      padding: 12px 16px;
      cursor: pointer;
      box-shadow: 0 12px 20px rgba(35,184,106,0.2);
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(11, 14, 30, 0.45);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-panel {
      width: min(560px, 100%);
      background: var(--panel);
      border-radius: 22px 22px 0 0;
      padding: 16px;
      box-shadow: 0 -18px 40px rgba(0,0,0,0.14);
      transform: translateY(30px);
      transition: transform 0.2s ease;
    }

    .modal.show .modal-panel {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .modal-close {
      border: none;
      background: var(--panel-soft);
      color: var(--text);
      width: 34px;
      height: 34px;
      border-radius: 10px;
      font-size: 1.2rem;
      cursor: pointer;
      font-weight: 800;
    }

    .modal-image {
      width: 100%;
      height: 210px;
      object-fit: cover;
      border-radius: 20px;
      display: block;
      margin-bottom: 14px;
    }

    .modal-title {
      font-size: 1.32rem;
      font-weight: 900;
      margin: 0 0 6px;
    }

    .modal-meta {
      color: var(--muted);
      font-size: 0.82rem;
      margin-bottom: 12px;
    }

    .modal-desc {
      color: var(--text);
      line-height: 1.5;
      font-size: 0.92rem;
      margin-bottom: 16px;
    }

    .modal-price-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 16px;
    }

    .qty-box {
      display: inline-flex;
      align-items: center;
      background: var(--panel-soft);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--line);
    }

    .quantity-btn {
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      color: var(--text);
      font-weight: 900;
      cursor: pointer;
    }

    .qty-value {
      min-width: 32px;
      text-align: center;
      font-weight: 800;
    }

    .modal-action {
      width: 100%;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: white;
      padding: 12px 16px;
      cursor: pointer;
      font-weight: 900;
      box-shadow: 0 12px 20px rgba(77,94,246,0.2);
    }

    @media (min-width: 500px) {
      .content {
        max-width: 560px;
        margin: 0 auto;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand-wrap">
      <div class="brand-mark">S</div>
      <div class="brand">Sale05</div>
    </div>
    <div id="cart-badge" class="cart-pill">0</div>
  </header>

  <main class="content">
    <section id="page-catalog" class="page active">
      <div class="promo">
        <div class="promo-tag">Лимитированная акция</div>
        <h2>Скидки до 40% на лучшие товары</h2>
        <p>Новые акции каждую неделю. Бесплатная доставка от 1500 ₽.</p>
        <div class="promo-row">
          <div class="mini-pill">⚡ Быстрая доставка</div>
          <div class="mini-pill">🎁 Подарки</div>
        </div>
      </div>

      <div id="categories" class="categories"></div>

      <div class="toolbar">
        <div class="search-wrap">
          <input id="search" class="search-input" type="text" placeholder="Поиск товаров..." />
        </div>
        <select id="sort" class="sort-select">
          <option value="popular">Популярное</option>
          <option value="cheap">Сначала дешевые</option>
          <option value="expensive">Сначала дорогие</option>
          <option value="discount">Скидки</option>
        </select>
      </div>

      <div id="product-list" class="product-list"></div>
    </section>

    <section id="page-cart" class="page">
      <div class="cart-header">
        <h3>🛒 Корзина</h3>
      </div>

      <div id="cart-list" class="cart-list"></div>

      <div class="promo-box">
        <span><strong>Промокод</strong> — работает на сумму от 1500 ₽</span>
      </div>
      <input class="promo-input" type="text" placeholder="Введите промокод" />

      <div id="cart-total" class="cart-total"></div>
      <button id="checkout-btn" class="checkout-btn">Оформить заказ</button>
    </section>
  </main>

  <nav class="bottom-nav">
    <div class="nav-item active" data-page="catalog">
      <span class="nav-emoji">🏠</span>
      <span>Каталог</span>
    </div>
    <div class="nav-item" data-page="cart">
      <span class="nav-emoji">🛒</span>
      <span>Корзина</span>
    </div>
  </nav>

  <div id="modal" class="modal" aria-hidden="true">
    <div class="modal-panel">
      <div class="modal-header">
        <div style="font-weight:900; font-size:1.04rem;">Подробно</div>
        <button id="close-modal" class="modal-close" type="button">×</button>
      </div>
      <img id="modal-image" class="modal-image" src="" alt="" />
      <h3 id="modal-title" class="modal-title"></h3>
      <div id="modal-meta" class="modal-meta"></div>
      <div id="modal-desc" class="modal-desc"></div>
      <div class="modal-price-row">
        <div>
          <div id="modal-old" class="old-price"></div>
          <div id="modal-price" class="new-price"></div>
        </div>
        <div class="qty-box">
          <button class="quantity-btn" type="button" data-action="minus">−</button>
          <div id="modal-qty" class="qty-value">1</div>
          <button class="quantity-btn" type="button" data-action="plus">+</button>
        </div>
      </div>
      <button id="modal-add" class="modal-action" type="button">Добавить в корзину</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) tg.ready();

    const app = {
      cart: [],
      activeCategory: 'all',
      currentSort: 'popular',
      currentModalProduct: null,
      modalQty: 1,
      products: [
        { id: 1, category: 'food', store: 'СуперМаркет', product: 'Молоко 3,2%', price: 79, discount: 20, image: 'https://images.unsplash.com/photo-1550583724-b2692b85b150?auto=format&fit=crop&w=900&q=80', description: 'Свежий продукт с натуральным вкусом и высоким качеством.', rating: 4.8, stock: 27 },
        { id: 2, category: 'food', store: 'СуперМаркет', product: 'Кефир 1%', price: 85, discount: 15, image: 'https://images.unsplash.com/photo-1570584191640-7dfe2ffeb65a?auto=format&fit=crop&w=900&q=80', description: 'Нежный кефир для завтрака, легкий и полезный.', rating: 4.7, stock: 18 },
        { id: 3, category: 'food', store: 'FreshBox', product: 'Яблоки Gala', price: 189, discount: 12, image: 'https://images.unsplash.com/photo-1567306226416-28f0efdc88ce?auto=format&fit=crop&w=900&q=80', description: 'Сладкие и хрустящие яблоки, идеальны для перекуса.', rating: 4.9, stock: 32 },
        { id: 4, category: 'food', store: 'FreshBox', product: 'Авокадо', price: 160, discount: 10, image: 'https://images.unsplash.com/photo-1519162808019-7de1683fa2ad?auto=format&fit=crop&w=900&q=80', description: 'Спелое авокадо для смузи, салатов и завтраков.', rating: 4.6, stock: 22 },
        { id: 5, category: 'tech', store: 'ТехноДом', product: 'Пылесос X10', price: 11990, discount: 20, image: 'https://images.unsplash.com/photo-1581578731548-c64695cc6952?auto=format&fit=crop&w=900&q=80', description: 'Мощный и тихий пылесос для дома и квартиры.', rating: 4.9, stock: 9 },
        { id: 6, category: 'tech', store: 'ТехноДом', product: 'Утюг Pro', price: 4500, discount: 10, image: 'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=900&q=80', description: 'Плавная глажка, защита ткани и быстрый нагрев.', rating: 4.5, stock: 15 },
        { id: 7, category: 'tech', store: 'GadgetHub', product: 'Наушники Air Lite', price: 5990, discount: 25, image: 'https://images.unsplash.com/photo-1546435770-a3e426bf472b?auto=format&fit=crop&w=900&q=80', description: 'Комфортный звук и долгий заряд в компактном корпусе.', rating: 4.8, stock: 12 },
        { id: 8, category: 'tech', store: 'GadgetHub', product: 'Умная колонка', price: 8890, discount: 18, image: 'https://images.unsplash.com/photo-1518444065439-e933c06ce9cd?auto=format&fit=crop&w=900&q=80', description: 'Голосовой помощник, музыка и умный дом в одном.', rating: 4.7, stock: 11 },
        { id: 9, category: 'fashion', store: 'FashionStyle', product: 'Футболка базовая', price: 1390, discount: 30, image: 'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=900&q=80', description: 'Легкая футболка из хлопка для повседневной носки.', rating: 4.6, stock: 42 },
        { id: 10, category: 'fashion', store: 'FashionStyle', product: 'Худи черное', price: 2990, discount: 25, image: 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=900&q=80', description: 'Теплое худи с мягкой тканью и комфортным кроем.', rating: 4.9, stock: 21 },
        { id: 11, category: 'fashion', store: 'UrbanLook', product: 'Кроссовки Urban', price: 4290, discount: 22, image: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=900&q=80', description: 'Легкие и стильные кроссовки для повседневной ходьбы.', rating: 4.8, stock: 14 },
        { id: 12, category: 'fashion', store: 'UrbanLook', product: 'Сумка Everyday', price: 2490, discount: 15, image: 'https://images.unsplash.com/photo-1584917865442-de89df76afd3?auto=format&fit=crop&w=900&q=80', description: 'Премиальная сумка на каждый день и путешествия.', rating: 4.7, stock: 19 },
        { id: 13, category: 'home', store: 'HomeJoy', product: 'Текстильный набор', price: 1590, discount: 18, image: 'https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=900&q=80', description: 'Комфортный домашний набор для спальни и гостиной.', rating: 4.6, stock: 20 },
        { id: 14, category: 'home', store: 'HomeJoy', product: 'Одеяло Cozy', price: 3290, discount: 20, image: 'https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=900&q=80', description: 'Мягкое и теплое одеяло для спокойного сна.', rating: 4.9, stock: 10 },
        { id: 15, category: 'beauty', store: 'GlowLab', product: 'Крем для лица', price: 890, discount: 14, image: 'https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?auto=format&fit=crop&w=900&q=80', description: 'Увлажняющий крем для сияния и мягкости кожи.', rating: 4.8, stock: 27 },
        { id: 16, category: 'beauty', store: 'GlowLab', product: 'Сыворотка Vit C', price: 1290, discount: 16, image: 'https://images.unsplash.com/photo-1571781926291-c477ebfd024b?auto=format&fit=crop&w=900&q=80', description: 'Освежающая сыворотка с витамином C для сияния.', rating: 4.9, stock: 31 }
      ],
      categoryMeta: {
        all: 'Все',
        food: 'Еда',
        tech: 'Техника',
        fashion: 'Одежда',
        home: 'Дом',
        beauty: 'Красота'
      },

      init() {
        this.renderCategories();
        this.renderCatalog();

        document.getElementById('search').addEventListener('input', (event) => {
          this.renderCatalog(event.target.value.trim());
        });

        document.getElementById('sort').addEventListener('change', (event) => {
          this.currentSort = event.target.value;
          this.renderCatalog(document.getElementById('search').value.trim());
        });

        document.querySelectorAll('.nav-item').forEach((item) => {
          item.addEventListener('click', () => this.switchPage(item.dataset.page));
        });

        document.getElementById('checkout-btn').addEventListener('click', () => this.checkout());

        document.getElementById('close-modal').addEventListener('click', () => this.closeModal());
        document.getElementById('modal').addEventListener('click', (event) => {
          if (event.target === document.getElementById('modal')) {
            this.closeModal();
          }
        });

        document.getElementById('modal-add').addEventListener('click', () => {
          if (!this.currentModalProduct) return;
          this.addToCart(this.currentModalProduct, this.modalQty);
          this.closeModal();
        });

        document.querySelectorAll('.quantity-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            const action = btn.dataset.action;
            if (action === 'plus') this.modalQty += 1;
            if (action === 'minus') this.modalQty = Math.max(1, this.modalQty - 1);
            document.getElementById('modal-qty').textContent = String(this.modalQty);
          });
        });
      },

      renderCategories() {
        const categoriesEl = document.getElementById('categories');
        categoriesEl.innerHTML = '';

        Object.entries(this.categoryMeta).forEach(([key, label]) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'category' + (this.activeCategory === key ? ' active' : '');
          btn.textContent = label;
          btn.addEventListener('click', () => {
            this.activeCategory = key;
            this.renderCategories();
            this.renderCatalog(document.getElementById('search').value.trim());
          });
          categoriesEl.appendChild(btn);
        });
      },

      getFilteredProducts(query = '') {
        const normalized = query.toLowerCase();
        let items = this.products.filter((item) => {
          const matchesCategory = this.activeCategory === 'all' || item.category === this.activeCategory;
          const matchesQuery = !normalized || item.product.toLowerCase().includes(normalized) || item.store.toLowerCase().includes(normalized);
          return matchesCategory && matchesQuery;
        });

        if (this.currentSort === 'cheap') {
          items = items.sort((a, b) => a.price - b.price);
        } else if (this.currentSort === 'expensive') {
          items = items.sort((a, b) => b.price - a.price);
        } else if (this.currentSort === 'discount') {
          items = items.sort((a, b) => b.discount - a.discount);
        } else {
          items = items.sort((a, b) => (b.rating || 0) - (a.rating || 0));
        }

        return items;
      },

      renderCatalog(query = '') {
        const list = document.getElementById('product-list');
        const items = this.getFilteredProducts(query);
        list.innerHTML = '';

        if (!items.length) {
          list.innerHTML = '<div class="empty-state">Товары не найдены</div>';
          return;
        }

        items.forEach((item) => {
          const card = document.createElement('div');
          card.className = 'product-card';

          const imageWrap = document.createElement('div');
          imageWrap.className = 'product-image-wrapper';

          const image = document.createElement('img');
          image.className = 'product-image';
          image.src = item.image;
          image.alt = item.product;
          image.loading = 'lazy';

          const favoriteBtn = document.createElement('button');
          favoriteBtn.type = 'button';
          favoriteBtn.className = 'favorite-btn';
          favoriteBtn.textContent = '♡';
          favoriteBtn.addEventListener('click', (event) => {
            event.stopPropagation();
            favoriteBtn.textContent = favoriteBtn.textContent === '♡' ? '♥' : '♡';
          });

          imageWrap.appendChild(image);
          imageWrap.appendChild(favoriteBtn);

          const info = document.createElement('div');
          info.className = 'product-info';

          const top = document.createElement('div');
          top.className = 'product-top';

          const store = document.createElement('div');
          store.className = 'store-name';
          store.textContent = item.store;

          const rating = document.createElement('div');
          rating.className = 'rating';
          rating.textContent = '★ ' + item.rating;

          top.appendChild(store);
          top.appendChild(rating);

          const name = document.createElement('div');
          name.className = 'product-name';
          name.textContent = item.product;

          const desc = document.createElement('div');
          desc.className = 'desc';
          desc.textContent = item.description;

          const metaRow = document.createElement('div');
          metaRow.className = 'meta-row';

          const priceBox = document.createElement('div');
          priceBox.className = 'price-box';

          const oldPrice = document.createElement('div');
          oldPrice.className = 'old-price';
          oldPrice.textContent = Math.round(item.price / (1 - item.discount / 100)) + ' ₽';

          const price = document.createElement('div');
          price.className = 'new-price';
          price.textContent = item.price + ' ₽';

          priceBox.appendChild(oldPrice);
          priceBox.appendChild(price);

          const badge = document.createElement('div');
          badge.className = 'discount-badge';
          badge.textContent = '-' + item.discount + '%';

          metaRow.appendChild(priceBox);
          metaRow.appendChild(badge);

          const btnRow = document.createElement('div');
          btnRow.className = 'btn-row';

          const detailBtn = document.createElement('button');
          detailBtn.type = 'button';
          detailBtn.className = 'ghost-btn';
          detailBtn.textContent = 'i';
          detailBtn.addEventListener('click', (event) => {
            event.stopPropagation();
            this.openModal(item);
          });

          const addBtn = document.createElement('button');
          addBtn.type = 'button';
          addBtn.className = 'add-btn';
          addBtn.textContent = 'В корзину';
          addBtn.addEventListener('click', (event) => {
            event.stopPropagation();
            this.addToCart(item);
          });

          btnRow.appendChild(detailBtn);
          btnRow.appendChild(addBtn);

          info.appendChild(top);
          info.appendChild(name);
          info.appendChild(desc);
          info.appendChild(metaRow);
          info.appendChild(btnRow);

          card.appendChild(imageWrap);
          card.appendChild(info);
          card.addEventListener('click', () => this.openModal(item));
          list.appendChild(card);
        });
      },

      switchPage(pageName) {
        document.querySelectorAll('.page').forEach((el) => {
          el.classList.toggle('active', el.id === 'page-' + pageName);
        });

        document.querySelectorAll('.nav-item').forEach((el) => {
          el.classList.toggle('active', el.dataset.page === pageName);
        });

        if (pageName === 'cart') {
          this.renderCart();
        }
      },

      addToCart(item, qty = 1) {
        const existingIndex = this.cart.findIndex((cartItem) => cartItem.id === item.id);

        if (existingIndex >= 0) {
          this.cart[existingIndex].qty += qty;
        } else {
          this.cart.push({
            id: item.id,
            name: item.product,
            price: item.price,
            category: item.category,
            image: item.image,
            qty: qty
          });
        }

        this.updateCartBadge();
        this.renderCart();
      },

      updateCartBadge() {
        const total = this.cart.reduce((sum, item) => sum + item.qty, 0);
        document.getElementById('cart-badge').textContent = String(total);
      },

      renderCart() {
        const list = document.getElementById('cart-list');
        const totalEl = document.getElementById('cart-total');
        list.innerHTML = '';

        if (!this.cart.length) {
          list.innerHTML = '<div class="empty-state">Корзина пуста</div>';
          totalEl.textContent = '';
          return;
        }

        let total = 0;
        this.cart.forEach((item, index) => {
          total += item.price * item.qty;

          const row = document.createElement('div');
          row.className = 'cart-item';

          const left = document.createElement('div');
          left.className = 'cart-left';

          const thumb = document.createElement('div');
          thumb.className = 'cart-thumb';
          const img = document.createElement('img');
          img.src = item.image;
          img.alt = item.name;
          thumb.appendChild(img);

          const text = document.createElement('div');
          const name = document.createElement('div');
          name.className = 'cart-name';
          name.textContent = item.name;

          const price = document.createElement('div');
          price.className = 'cart-price';
          price.textContent = item.qty + ' × ' + item.price + ' ₽';

          text.appendChild(name);
          text.appendChild(price);
          left.appendChild(thumb);
          left.appendChild(text);

          const remove = document.createElement('button');
          remove.className = 'remove-btn';
          remove.type = 'button';
          remove.textContent = '×';
          remove.addEventListener('click', () => this.removeFromCart(index));

          row.appendChild(left);
          row.appendChild(remove);
          list.appendChild(row);
        });

        totalEl.innerHTML = '<span>Итого</span><span>' + total + ' ₽</span>';
      },

      removeFromCart(index) {
        this.cart.splice(index, 1);
        this.updateCartBadge();
        this.renderCart();
      },

      openModal(product) {
        this.currentModalProduct = product;
        this.modalQty = 1;

        const modal = document.getElementById('modal');
        const image = document.getElementById('modal-image');
        const title = document.getElementById('modal-title');
        const meta = document.getElementById('modal-meta');
        const desc = document.getElementById('modal-desc');
        const oldPrice = document.getElementById('modal-old');
        const price = document.getElementById('modal-price');
        const qty = document.getElementById('modal-qty');

        image.src = product.image;
        image.alt = product.product;
        title.textContent = product.product;
        meta.textContent = product.store + ' • ' + product.rating + ' ★ • Остаток: ' + product.stock;
        desc.textContent = product.description;
        oldPrice.textContent = Math.round(product.price / (1 - product.discount / 100)) + ' ₽';
        price.textContent = product.price + ' ₽';
        qty.textContent = '1';

        modal.classList.add('show');
        modal.setAttribute('aria-hidden', 'false');
      },

      closeModal() {
        const modal = document.getElementById('modal');
        modal.classList.remove('show');
        modal.setAttribute('aria-hidden', 'true');
        this.currentModalProduct = null;
        this.modalQty = 1;
      },

      checkout() {
        const total = this.cart.reduce((sum, item) => sum + item.price * item.qty, 0);
        if (!this.cart.length) return;

        const payload = {
          items: this.cart,
          total: total,
          createdAt: new Date().toISOString()
        };

        if (tg) {
          tg.sendData(JSON.stringify(payload));
        } else {
          alert('Заказ сформирован на сумму: ' + total + ' ₽');
        }
      }
    };

    app.init();
  </script>
</body>
</html>
