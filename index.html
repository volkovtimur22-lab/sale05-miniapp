<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Shawarma Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-1: #fff5ea;
      --bg-2: #ffe7c7;
      --bg-3: #ffd7a3;
      --panel: rgba(255,255,255,0.86);
      --primary: #1d130f;
      --primary-2: #4a2a1a;
      --accent: #ff8a2d;
      --accent-strong: #ef6b1d;
      --accent-soft: rgba(255, 138, 45, 0.12);
      --success: #1fa76d;
      --text: #201712;
      --muted: #675551;
      --line: rgba(32, 23, 18, 0.08);
      --shadow: 0 18px 34px rgba(41, 23, 14, 0.12);
      --radius: 24px;
      --pink: #ff9fd4;
      --purple: #a68cff;
      --blue: #7ad7ff;
      --orange: #ffbf5c;
      --yellow: #ffe26d;
      --green: #78dfa1;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 35%, #fffdfb 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      background-image:
        radial-gradient(circle at 12% 10%, rgba(255, 179, 94, 0.32), transparent 20%),
        radial-gradient(circle at 86% 18%, rgba(255, 122, 158, 0.35), transparent 18%),
        radial-gradient(circle at 70% 76%, rgba(125, 196, 255, 0.28), transparent 22%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(135deg, rgba(255, 246, 235, 0.4), rgba(255, 237, 212, 0.2)),
        url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200"><defs><linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="%23f7d9ad"/><stop offset="1" stop-color="%23f4a65b"/></linearGradient></defs><rect width="1200" height="1200" fill="url(%23bg)"/><g opacity="0.9"><ellipse cx="250" cy="330" rx="220" ry="160" fill="%23f6c877"/><ellipse cx="880" cy="420" rx="245" ry="180" fill="%23f4a871"/><ellipse cx="630" cy="830" rx="300" ry="190" fill="%23f2dca8"/><g transform="translate(420 420)"><path d="M0 180C40 40 180 20 260 120C320 190 310 300 220 350L70 360C-30 320 -40 230 0 180Z" fill="%23e18d45"/><path d="M60 220C110 110 190 110 245 180C200 250 130 275 60 220Z" fill="%23d1a04a"/><path d="M40 150C95 90 190 90 240 150" stroke="%2387552c" stroke-width="18" fill="none"/><path d="M70 185L195 185" stroke="%236a9f3d" stroke-width="12" linecap="round"/><path d="M70 205L218 205" stroke="%232e8c3a" stroke-width="12" linecap="round"/><path d="M86 232L178 232" stroke="%2395d75f" stroke-width="10" linecap="round"/><path d="M90 120C100 80 120 55 150 45C178 55 192 84 198 118" fill="%23f4d2a0" opacity="0.8"/></g></g></svg>');
      background-size: cover;
      background-position: center;
      filter: blur(5px) saturate(1.2) contrast(1.08);
      opacity: 0.22;
      z-index: 0;
      pointer-events: none;
      transform: scale(1.08);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(255,247,239,0.8) 0%, rgba(255,247,239,0.48) 18%, rgba(255,247,239,0.7) 100%);
      z-index: 0;
      pointer-events: none;
    }

    button, input, select {
      font: inherit;
    }

    .hidden { display: none !important; }

    .boot-screen {
      position: fixed;
      inset: 0;
      z-index: 200;
      background:
        radial-gradient(circle at 50% 24%, rgba(255, 210, 116, 0.38), rgba(255, 136, 59, 0.16) 26%, transparent 40%),
        linear-gradient(135deg, #2a160d 0%, #3d1c12 22%, #140f0d 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .boot-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .boot-screen::before,
    .boot-screen::after {
      content: "";
      position: absolute;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: rgba(255, 186, 92, 0.15);
      filter: blur(20px);
      animation: pulseGlow 3s ease-in-out infinite alternate;
    }

    .boot-screen::before { transform: translate(-120px, -50px); }
    .boot-screen::after { transform: translate(120px, 90px); }

    @keyframes pulseGlow {
      0% { transform: scale(0.94); opacity: 0.7; }
      100% { transform: scale(1.08); opacity: 1; }
    }

    .brand-loader {
      position: relative;
      width: 158px;
      height: 158px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .loader-ring {
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      border: 1px solid rgba(255, 202, 144, 0.8);
      animation: spin 5s linear infinite;
      box-shadow: 0 0 18px rgba(255, 170, 77, 0.22);
    }

    .loader-ring::before,
    .loader-ring::after {
      content: "";
      position: absolute;
      inset: 14px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.4);
    }

    .loader-ring::after {
      inset: 28px;
      border-color: rgba(255, 170, 77, 0.6);
      animation: spinReverse 3.2s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes spinReverse {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }

    .loader-core {
      width: 84px;
      height: 84px;
      border-radius: 25px;
      background: linear-gradient(135deg, #ffcc74 0%, #ff8e34 30%, #c66327 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: white;
      font-size: 2rem;
      box-shadow: 0 0 26px rgba(255, 143, 44, 0.42);
      animation: breathe 2s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(0.96); }
      50% { transform: scale(1.06); }
    }

    .loader-text {
      text-transform: uppercase;
      letter-spacing: 0.26em;
      font-weight: 800;
      font-size: 0.7rem;
      color: rgba(255, 234, 205, 0.9);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 16px 14px;
      background: rgba(255, 253, 250, 0.75);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: linear-gradient(135deg, #ffca80 0%, #ff8d2f 50%, #9a4d1f 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 900;
      box-shadow: 0 14px 18px rgba(255, 143, 44, 0.25);
    }

    .brand {
      font-weight: 900;
      letter-spacing: 0.09em;
      font-size: 1.08rem;
      color: var(--primary);
    }

    .cart-pill {
      min-width: 30px;
      height: 30px;
      border-radius: 999px;
      background: rgba(255, 143, 44, 0.12);
      border: 1px solid rgba(255, 143, 44, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      color: var(--primary);
      font-weight: 800;
      font-size: 0.76rem;
    }

    .content {
      position: relative;
      z-index: 1;
      flex: 1;
      padding: 16px 16px 94px;
      overflow-y: auto;
    }

    .content::-webkit-scrollbar { display: none; }

    .page { display: none; }
    .page.active { display: block; }

    .hero {
      position: relative;
      overflow: hidden;
      border-radius: 30px;
      padding: 18px 16px 16px;
      margin-bottom: 18px;
      background:
        linear-gradient(135deg, rgba(20,12,9,0.7), rgba(71,32,18,0.82)),
        url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><defs><linearGradient id="a" x1="0" x2="1"><stop offset="0" stop-color="%23f1c77a"/><stop offset="1" stop-color="%23d77935"/></linearGradient></defs><rect width="1400" height="900" fill="%23291a14"/><g opacity="0.9"><circle cx="240" cy="210" r="130" fill="%23ffbd68"/><circle cx="1180" cy="220" r="150" fill="%23ff9b66"/><path d="M380 540C410 390 510 330 620 350C760 380 820 410 900 540L990 720H290L380 540Z" fill="url(%23a)"/><path d="M470 500C515 420 580 390 650 410C720 430 760 470 790 530C740 610 660 650 560 640C510 620 485 570 470 500Z" fill="%23c66d34"/><path d="M540 520C590 465 665 465 715 520" stroke="%2364482d" stroke-width="18" fill="none"/><path d="M505 565H775" stroke="%2352a446" stroke-width="20" stroke-linecap="round"/><path d="M525 610H750" stroke="%238fcd5d" stroke-width="14" stroke-linecap="round"/><path d="M565 670H715" stroke="%23c9e46a" stroke-width="10" stroke-linecap="round"/></g></svg>') center/cover no-repeat;
      color: white;
      box-shadow: 0 18px 30px rgba(61, 34, 21, 0.24);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      right: -36px;
      top: -34px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 186, 92, 0.42), rgba(255, 186, 92, 0.16) 36%, transparent 72%);
    }

    .hero-tag {
      display: inline-block;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.16);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #ffe4c4;
    }

    .hero h2 {
      margin: 12px 0 8px;
      font-size: 1.6rem;
      line-height: 1.2;
    }

    .hero p {
      margin: 0;
      color: rgba(255, 234, 213, 0.88);
      line-height: 1.5;
      font-size: 0.92rem;
    }

    .hero-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .mini-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      color: #ffe7cf;
      font-size: 0.72rem;
      font-weight: 800;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 14px;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar { display: none; }

    .category {
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.8);
      color: var(--muted);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 0.8rem;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .category.active {
      background: linear-gradient(135deg, #ff9d3f, #ff7a2d);
      color: white;
      border-color: rgba(255,138,44,0.2);
      box-shadow: 0 12px 18px rgba(255,138,44,0.2);
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .search-wrap { flex: 1; }

    .search-input {
      width: 100%;
      padding: 12px 14px;
      background: rgba(255,255,255,0.8);
      border: 1px solid rgba(35,25,19,0.08);
      border-radius: 14px;
      color: var(--text);
      outline: none;
    }

    .search-input:focus {
      box-shadow: 0 0 0 4px rgba(255,143,44,0.1);
      border-color: rgba(255,143,44,0.24);
    }

    .sort-select {
      background: rgba(255,255,255,0.8);
      border: 1px solid rgba(35,25,19,0.08);
      border-radius: 12px;
      color: var(--text);
      padding: 11px 12px;
      font-weight: 700;
      outline: none;
    }

    .section-block {
      margin-top: 20px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 8px 0 14px;
    }

    .section-header h3 {
      margin: 0;
      font-size: 1.18rem;
    }

    .badge-small {
      font-size: 0.72rem;
      font-weight: 800;
      color: #904c18;
      background: rgba(255,143,44,0.12);
      border-radius: 999px;
      padding: 6px 10px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .product-card {
      background: rgba(255,255,255,0.82);
      border: 1px solid rgba(35,25,19,0.08);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 12px;
      display: grid;
      grid-template-columns: 94px 1fr;
      gap: 12px;
      cursor: pointer;
    }

    .product-image-wrap {
      position: relative;
      width: 94px;
      height: 94px;
      border-radius: 18px;
      overflow: hidden;
      background: linear-gradient(135deg, #fff3e4, #fbe3d0);
      border: 1px solid rgba(35,25,19,0.04);
    }

    .product-image {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .favorite-btn {
      position: absolute;
      top: 7px;
      right: 7px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
      border: none;
      color: #d25353;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 12px rgba(0,0,0,0.08);
    }

    .favorite-btn.active {
      background: rgba(255,255,255,0.96);
    }

    .product-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .product-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .store-name {
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .rating {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(255, 143, 44, 0.12);
      color: #b55a20;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 0.7rem;
      font-weight: 800;
    }

    .product-name {
      margin-top: 6px;
      color: var(--text);
      font-weight: 900;
      font-size: 1rem;
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .desc {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .meta-row {
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .price-box {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .old-price {
      color: var(--muted);
      font-size: 0.72rem;
      text-decoration: line-through;
    }

    .new-price {
      color: var(--success);
      font-size: 1.06rem;
      font-weight: 900;
    }

    .discount-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 0.72rem;
      font-weight: 800;
      background: rgba(255,143,44,0.12);
      color: #b55a20;
    }

    .btn-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
    }

    .ghost-btn, .add-btn {
      border: none;
      border-radius: 12px;
      padding: 10px 12px;
      cursor: pointer;
      font-weight: 800;
      transition: transform 0.15s ease;
    }

    .ghost-btn:active, .add-btn:active, .checkout-btn:active, .quantity-btn:active, .modal-action:active, .remove-btn:active, .nav-item:active {
      transform: translateY(1px) scale(0.99);
    }

    .ghost-btn {
      background: rgba(35,25,19,0.06);
      color: var(--text);
      border: 1px solid rgba(35,25,19,0.08);
      min-width: 42px;
      flex: 0 0 auto;
    }

    .add-btn {
      flex: 1;
      background: linear-gradient(135deg, #ff9d3f, #ff7a2d);
      color: white;
      box-shadow: 0 12px 20px rgba(255,118,39,0.22);
    }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 10px 12px 18px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(8px);
      border-top: 1px solid rgba(35,25,19,0.08);
      z-index: 40;
    }

    .nav-item {
      width: 33.333%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 800;
      cursor: pointer;
      user-select: none;
    }

    .nav-item.active { color: var(--primary); }
    .nav-emoji { font-size: 1.4rem; line-height: 1; }

    .empty-state {
      background: rgba(255,255,255,0.72);
      border: 1px solid rgba(35,25,19,0.08);
      border-radius: var(--radius);
      color: var(--muted);
      padding: 28px 16px;
      text-align: center;
      line-height: 1.5;
    }

    .cart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 6px 0 16px;
    }

    .cart-header h3 {
      margin: 0;
      font-size: 1.2rem;
    }

    .cart-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .cart-item {
      background: rgba(255,255,255,0.8);
      border: 1px solid rgba(35,25,19,0.08);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .cart-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .cart-thumb {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      overflow: hidden;
      background: linear-gradient(135deg, #fff5ef, #f7eae0);
      border: 1px solid rgba(35,25,19,0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .cart-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cart-name {
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cart-price {
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 2px;
    }

    .remove-btn {
      width: 32px;
      height: 32px;
      border: 1px solid rgba(35,25,19,0.08);
      border-radius: 10px;
      background: rgba(255,143,44,0.08);
      color: #b75b1f;
      font-weight: 900;
      cursor: pointer;
    }

    .promo-box {
      margin-top: 18px;
      background: rgba(255,143,44,0.08);
      border: 1px solid rgba(255,143,44,0.18);
      border-radius: 16px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: #9a4b1e;
    }

    .promo-box strong { color: #8d4205; }

    .promo-input {
      width: 100%;
      margin-top: 12px;
      background: rgba(255,255,255,0.8);
      border: 1px solid rgba(35,25,19,0.08);
      border-radius: 10px;
      padding: 10px 12px;
      outline: none;
      color: var(--text);
    }

    .cart-total {
      margin-top: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-weight: 900;
      font-size: 1.08rem;
      padding-top: 12px;
      border-top: 1px solid rgba(35,25,19,0.08);
    }

    .checkout-btn {
      margin-top: 16px;
      width: 100%;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #ff9d3f, #ff7a2d);
      color: white;
      font-weight: 900;
      padding: 12px 16px;
      cursor: pointer;
      box-shadow: 0 12px 20px rgba(255,118,39,0.22);
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(15,8,6,0.58);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    const modalQty = document.getElementById('modal-qty');

    function startBootScreen() {
      setTimeout(() => {
        document.getElementById('boot-screen').classList.add('hidden');
      }, 1000);
    }

    function formatPrice(value) {
      return `${value} ₽`;
    }

    function getProductsForDisplay() {
      let result = catalog.filter((product) => {
        const matchesCategory = appState.activeCategory === 'all' || product.category === appState.activeCategory;
        const lowerQuery = appState.searchTerm.trim().toLowerCase();
        const matchesSearch = !lowerQuery || product.name.toLowerCase().includes(lowerQuery);
        return matchesCategory && matchesSearch;
      });

      if (appState.sortMode === 'price-low') {
        result = [...result].sort((a, b) => a.price - b.price);
      } else if (appState.sortMode === 'price-high') {
        result = [...result].sort((a, b) => b.price - a.price);
      } else {
        result = [...result].sort((a, b) => b.rating - a.rating);
      }

      return result;
    }

    function renderHome() {
      const products = getProductsForDisplay();
      const shawarmaItems = products.filter((item) => item.category === 'shawarma');
      const drinkItems = products.filter((item) => item.category === 'drinks');

      const sections = [
        { title: 'Шаурма', items: shawarmaItems },
        { title: 'Напитки', items: drinkItems }
      ].filter((section) => {
        if (appState.activeCategory === 'all') return true;
        if (appState.activeCategory === 'shawarma') return section.title === 'Шаурма';
        if (appState.activeCategory === 'drinks') return section.title === 'Напитки';
        return false;
      });

      if (!sections.some((section) => section.items.length)) {
        homeContent.innerHTML = '<div class="empty-state">Ничего не найдено. Попробуйте другой поиск.</div>';
        return;
      }

      homeContent.innerHTML = sections.map((section) => {
        if (!section.items.length) return '';
        return `
          <div class="section-block">
            <div class="section-header">
              <h3>${section.title}</h3>
              <span class="badge-small">${section.items.length} видов</span>
            </div>
            <div class="product-grid">
              ${section.items.map((product) => `
                <article class="product-card" data-id="${product.id}" data-category="${product.category}">
                  <div class="product-image-wrap">
                    <button class="favorite-btn" aria-label="Избранное">♡</button>
                    <img class="product-image" src="${product.images[0]}" alt="${product.name}" />
                  </div>
                  <div class="product-info">
                    <div class="product-top">
                      <span class="store-name">${product.store}</span>
                      <span class="rating">⭐ ${product.rating}</span>
                    </div>
                    <div class="product-name">${product.name}</div>
                    <div class="desc">${product.description}</div>
                    <div class="meta-row">
                      <div class="price-box">
                        <span class="old-price">${formatPrice(product.oldPrice)}</span>
                        <span class="new-price">${formatPrice(product.price)}</span>
                      </div>
                      <span class="discount-badge">${product.discount}</span>
                    </div>
                    <div class="btn-row">
                      <button class="ghost-btn" type="button" data-action="preview" data-id="${product.id}">♡</button>
                      <button class="add-btn" type="button" data-action="add" data-id="${product.id}">Добавить</button>
                    </div>
                  </div>
                </article>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');

      attachCardEvents();
    }

    function attachCardEvents() {
      document.querySelectorAll('.product-card').forEach((card) => {
        card.addEventListener('click', (event) => {
          const target = event.target;
          const button = target.closest('button');
          const productId = card.dataset.id;
          const product = catalog.find((item) => item.id === productId);

          if (!product) return;

          if (button && (button.dataset.action === 'add' || button.dataset.action === 'preview')) {
            openModal(product);
            return;
          }

          openModal(product);
        });
      });
    }

    function renderCart() {
      if (!appState.cart.length) {
        cartContent.innerHTML = '<div class="empty-state">Корзина пуста. Добавьте шаурму или напиток.</div>';
        cartBadge.textContent = '0';
        cartCountBadge.textContent = '0 товаров';
        return;
      }

      const totalItems = appState.cart.reduce((sum, item) => sum + item.quantity, 0);
      const totalAmount = appState.cart.reduce((sum, item) => sum + item.price * item.quantity, 0);

      cartBadge.textContent = String(totalItems);
      cartCountBadge.textContent = `${totalItems} товаров`;

      cartContent.innerHTML = `
        <div class="cart-list">
          ${appState.cart.map((item) => `
            <div class="cart-item">
              <div class="cart-left">
                <div class="cart-thumb">
                  <img src="${item.image}" alt="${item.name}" />
                </div>
                <div>
                  <div class="cart-name">${item.name}</div>
                  <div class="cart-price">${item.meat || ''} ${item.ingredients && item.ingredients.length ? '· ' + item.ingredients.join(', ') : ''}</div>
                  <div class="cart-price">${item.quantity} × ${formatPrice(item.price)}</div>
                </div>
              </div>
              <button class="remove-btn" data-remove-id="${item.cartKey}">×</button>
            </div>
          `).join('')}
        </div>
        <div class="promo-box">
          <strong>Промокод</strong>
          <span>SHAWARMA</span>
        </div>
        <input class="promo-input" placeholder="Введите промокод" />
        <div class="cart-total">
          <span>Итого</span>
          <span>${formatPrice(totalAmount)}</span>
        </div>
        <button class="checkout-btn">Оформить заказ</button>
      `;

      document.querySelectorAll('.remove-btn').forEach((button) => {
        button.addEventListener('click', () => {
          const id = button.dataset.removeId;
          appState.cart = appState.cart.filter((item) => item.cartKey !== id);
          renderCart();
        });
      });
    }

    function openModal(product) {
      appState.modalProduct = product;
      appState.modalIndex = 0;
      appState.modalQuantity = 1;

      if (product.category === 'shawarma') {
        appState.selectedMeat = product.meats[0];
        appState.selectedSauce = product.sauces[0];
        appState.selectedIngredients = product.baseIngredients.slice(0, 3);
      }

      renderModal();
      modal.classList.add('show');
      modal.setAttribute('aria-hidden', 'false');
    }

    function closeModal() {
      modal.classList.remove('show');
      modal.setAttribute('aria-hidden', 'true');
      appState.modalProduct = null;
      appState.modalQuantity = 1;
    }

    function renderModal() {
      const product = appState.modalProduct;
      if (!product) return;

      const images = product.images || [];
      const activeImage = images[appState.modalIndex] || images[0];

      modalTitle.textContent = product.name;
      modalMeta.textContent = `${product.store} • ${product.category === 'shawarma' ? 'Шаурма' : 'Напиток'} • ${product.rating} ★`;
      modalDesc.textContent = product.description;
      modalPrice.textContent = formatPrice(product.price);
      modalOldPrice.textContent = product.oldPrice ? formatPrice(product.oldPrice) : '';
      modalMainImage.src = activeImage;
      modalMainImage.alt = product.name;
      modalQty.textContent = String(appState.modalQuantity);

      modalFeatureList.innerHTML = (product.features || []).map((feature) => `<li>${feature}</li>`).join('');

      thumbRow.innerHTML = images.map((image, index) => `
        <img class="thumb ${index === appState.modalIndex ? 'active' : ''}" src="${image}" alt="Фото ${index + 1}" data-thumb-index="${index}" />
      `).join('');

      thumbRow.querySelectorAll('.thumb').forEach((thumb) => {
        thumb.addEventListener('click', () => {
          appState.modalIndex = Number(thumb.dataset.thumbIndex);
          renderModal();
        });
      });

      if (product.category === 'shawarma') {
        customizationBlock.innerHTML = `
          <div class="custom-group">
            <div class="custom-label">Мясо</div>
            <div class="pill-row">
              ${product.meats.map((meat) => `
                <button class="choice-pill ${appState.selectedMeat === meat ? 'active' : ''}" data-type="meat" data-value="${meat}">${meat}</button>
              `).join('')}
            </div>
          </div>
          <div class="custom-group">
            <div class="custom-label">Начинка</div>
            <div class="pill-row">
              ${product.baseIngredients.map((ingredient) => `
                <button class="choice-pill ${appState.selectedIngredients.includes(ingredient) ? 'active' : ''}" data-type="ingredient" data-value="${ingredient}">${ingredient}</button>
              `).join('')}
            </div>
          </div>
          <div class="custom-group">
            <div class="custom-label">Соус</div>
            <div class="pill-row">
              ${product.sauces.map((sauce) => `
                <button class="choice-pill ${appState.selectedSauce === sauce ? 'active' : ''}" data-type="sauce" data-value="${sauce}">${sauce}</button>
              `).join('')}
            </div>
          </div>
        `;

        customizationBlock.querySelectorAll('.choice-pill').forEach((button) => {
          button.addEventListener('click', () => {
            const type = button.dataset.type;
            const value = button.dataset.value;

            if (type === 'meat') appState.selectedMeat = value;
            if (type === 'sauce') appState.selectedSauce = value;
            if (type === 'ingredient') {
              if (appState.selectedIngredients.includes(value)) {
                appState.selectedIngredients = appState.selectedIngredients.filter((item) => item !== value);
              } else {
                appState.selectedIngredients = [...appState.selectedIngredients, value];
              }
            }

            renderModal();
          });
        });
      } else {
        customizationBlock.innerHTML = '<div class="custom-group"><div class="custom-label">Параметры</div><div class="pill-row"><button class="choice-pill active" data-type="drink-option" data-value="Классический">Классический</button></div></div>';
      }
    }

    function addItemToCart(product) {
      const itemKey = `${product.id}-${appState.selectedMeat || 'classic'}-${(appState.selectedIngredients || []).join('|')}-${appState.selectedSauce || 'classic'}`;
      const existing = appState.cart.find((item) => item.cartKey === itemKey);

      if (existing) {
        existing.quantity += appState.modalQuantity;
      } else {
        appState.cart.push({
          cartKey: itemKey,
          id: product.id,
          name: product.name,
          image: product.images[0],
          price: product.price,
          quantity: appState.modalQuantity,
          meat: product.category === 'shawarma' ? appState.selectedMeat : '',
          ingredients: product.category === 'shawarma' ? appState.selectedIngredients : [],
          sauce: product.category === 'shawarma' ? appState.selectedSauce : ''
        });
      }

      renderCart();
      closeModal();
    }

    function attachModalActions() {
      document.getElementById('close-modal').addEventListener('click', closeModal);
      document.getElementById('prev-image').addEventListener('click', () => {
        if (!appState.modalProduct) return;
        appState.modalIndex = (appState.modalIndex - 1 + appState.modalProduct.images.length) % appState.modalProduct.images.length;
        renderModal();
      });
      document.getElementById('next-image').addEventListener('click', () => {
        if (!appState.modalProduct) return;
        appState.modalIndex = (appState.modalIndex + 1) % appState.modalProduct.images.length;
        renderModal();
      });
      document.getElementById('minus-qty').addEventListener('click', () => {
        appState.modalQuantity = Math.max(1, appState.modalQuantity - 1);
        modalQty.textContent = String(appState.modalQuantity);
      });
      document.getElementById('plus-qty').addEventListener('click', () => {
        appState.modalQuantity += 1;
        modalQty.textContent = String(appState.modalQuantity);
      });
      document.getElementById('add-to-cart-modal').addEventListener('click', () => {
        const product = appState.modalProduct;
        if (!product) return;
        addItemToCart(product);
      });

      modal.addEventListener('click', (event) => {
        if (event.target === modal) closeModal();
      });
    }

    function switchPage(pageName) {
      appState.currentPage = pageName;
      document.querySelectorAll('.page').forEach((page) => {
        page.classList.toggle('active', page.id === `${pageName}-page`);
      });

      document.querySelectorAll('.nav-item').forEach((item) => {
        item.classList.toggle('active', item.dataset.page === pageName);
      });
    }

    function initEvents() {
      searchInput.addEventListener('input', (event) => {
        appState.searchTerm = event.target.value;
        renderHome();
      });

      sortSelect.addEventListener('change', (event) => {
        appState.sortMode = event.target.value;
        renderHome();
      });

      mainCategories.addEventListener('click', (event) => {
        const button = event.target.closest('.category');
        if (!button) return;
        appState.activeCategory = button.dataset.category;
        document.querySelectorAll('.category').forEach((item) => item.classList.toggle('active', item === button));
        renderHome();
      });

      document.querySelectorAll('.nav-item').forEach((item) => {
        item.addEventListener('click', () => switchPage(item.dataset.page));
      });
    }

    function init() {
      startBootScreen();
      renderHome();
      renderCart();
      initEvents();
      attachModalActions();
    }

    init();
  </script>
</body>
</html>
